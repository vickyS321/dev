<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FGP Front Page Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: radial-gradient(circle at top, #e3f2fd, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.15);
      max-width: 550px;
      width: 90%;
      transition: transform 0.3s ease;
    }
    .container:hover {
      transform: scale(1.02);
    }
    h1 {
      text-align: center;
      font-family: 'Kanit', sans-serif;
      color: #1a237e;
      font-size: 30px;
      margin-bottom: 25px;
    }
    label {
      font-weight: 500;
      margin-top: 15px;
      display: block;
      color: #2e3c59;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #bbb;
      border-radius: 10px;
      font-size: 15px;
      background-color: #f8f9fa;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #42a5f5, #1e88e5);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 25px;
      transition: background 0.3s;
    }
    button:hover {
      background: linear-gradient(135deg, #1976d2, #0d47a1);
    }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📄 FGP Front Page Generator</h1>
    <form id="frontPageForm">
      <label for="branch">Branch</label>
      <select name="branch" required>
        <option value="Computer Science">Computer Science</option>
        <option value="Mechanical">Mechanical</option>
        <option value="Electronics">Electronics</option>
        <option value="IC">IC</option>
        <option value="PGDCA">PGDCA</option>
      </select><label for="session">Session</label>
  <input type="text" name="session" placeholder="e.g. 2024-2025" required />

  <label for="yearSemester">Year & Semester</label>
  <input type="text" name="yearSemester" placeholder="e.g. 2nd Year, 4th Sem" required />

  <label for="subject">Subject</label>
  <input type="text" name="subject" required />

  <label for="teacher">Teacher Name</label>
  <input type="text" name="teacher" required />

  <button type="submit">🚀 Generate Front Page</button>
</form>
<div class="footer">Created by Vidit Srivastava @ FGP</div>

  </div>  <script>
    document.getElementById("frontPageForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const data = new FormData(e.target);

      const frontPageHTML = `
        <html>
        <head>
          <title>Generated Front Page</title>
          <style>
            body {
              font-family: 'Roboto', sans-serif;
              text-align: center;
              padding-top: 60px;
              background: #f1f8e9;
            }
            h1 {
              font-size: 36px;
              color: #2e7d32;
              margin-bottom: 10px;
            }
            h2 {
              font-size: 26px;
              color: #333;
              margin-bottom: 30px;
            }
            p {
              font-size: 18px;
              margin: 15px 0;
            }
            .btn-area {
              margin-top: 40px;
            }
            button {
              background-color: #2e7d32;
              color: white;
              padding: 10px 18px;
              font-size: 16px;
              border: none;
              border-radius: 8px;
              margin: 10px;
              cursor: pointer;
            }
            button:hover {
              background-color: #1b5e20;
            }
            .footer {
              margin-top: 40px;
              font-size: 14px;
              color: #555;
            }
          </style></head>
    <body>
      <h1>📘 Feroze Gandhi Polytechnic</h1>
      <h2>${data.get("branch")}</h2>
      <p><strong>Session:</strong> ${data.get("session")}</p>
      <p><strong>Year & Semester:</strong> ${data.get("yearSemester")}</p>
      <p><strong>Subject:</strong> ${data.get("subject")}</p>
      <p><strong>Teacher:</strong> ${data.get("teacher")}</p>

      <div class="btn-area">
        <button onclick="window.print()">🖨 Print</button>
        <button onclick="downloadPDF()">⬇ Download PDF</button>
      </div>

      <div class="footer">Generated by Vidit Srivastava</div>

      <script>
        function downloadPDF() {
          const printContents = document.body.innerHTML;
          const win = window.open('', '', 'height=800,width=800');
          win.document.write('<html><head><title>Download</title>');
          win.document.write('</head><body >');
          win.document.write(printContents);
          win.document.write('</body></html>');
          win.document.close();
          win.print();
        }
      </script>
    </body>
    </html>
  `;

  const newWindow = window.open();
  newWindow.document.write(frontPageHTML);
  newWindow.document.close();
});

  </script>
</body>
</html>
